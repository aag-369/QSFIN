# Render.com blueprint — https://render.com/docs/blueprint-spec
# Connect this repo on Render (New -> Blueprint), it reads this file automatically.
services:
  - type: web
    name: qsfin
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn webapp.backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
